:root{--pine:#103b30;--forest:#08291f;--red:#a92e3c;--gold:#c9a15b;--ink:#183c33;--muted:#566d64;--paper:#fff;--scale:1}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#061c16;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:var(--ink)}button{font:inherit}button:focus-visible{outline:3px solid #f5d493;outline-offset:5px}
.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden}.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;transform:translate(-50%,-50%) scale(var(--scale));transform-origin:center;background:radial-gradient(ellipse at 50% 40%,#235344 0%,#103b30 53%,#08291f 100%)}
.stage::before{content:'';position:absolute;inset:28px;border:1px solid #a988506b;pointer-events:none}.stage::after{content:'';position:absolute;inset:38px;border:1px solid #b7924a24;pointer-events:none}
#snow{position:absolute;inset:0;width:1920px;height:1080px;z-index:1;pointer-events:none}.defs{position:absolute;width:0;height:0;overflow:hidden}.panel{position:absolute;inset:100px 142px 102px;background:var(--paper);border-radius:22px;box-shadow:0 24px 70px #00160f65;z-index:3}.panel::before{content:'';position:absolute;inset:15px;border:1px solid #d5ba817a;border-radius:12px;pointer-events:none}.panel::after{content:'';position:absolute;inset:22px;border:1px solid #c9a15b20;border-radius:8px;pointer-events:none}
.pine-corner{position:absolute;width:380px;height:310px;z-index:5;pointer-events:none}.pine-tl{top:17px;left:36px}.pine-tr{top:17px;right:36px;transform:scaleX(-1)}.pine-bl{bottom:18px;left:36px;transform:scaleY(-1)}.pine-br{bottom:18px;right:36px;transform:scale(-1)}
.string-lights{position:absolute;left:360px;top:16px;width:1200px;height:119px;z-index:6;pointer-events:none}.bulb{filter:drop-shadow(0 0 7px #ffe8a4);animation:glow 4s ease-in-out infinite alternate}.bulb:nth-of-type(2n){animation-delay:-2s}@keyframes glow{from{opacity:.7}to{opacity:1}}
.ornament{position:absolute;z-index:7;width:110px;height:240px;top:55px;pointer-events:none}.ornament.left{left:205px}.ornament.right{right:205px;top:57px}.small-star{position:absolute;color:#d9b875;z-index:4;pointer-events:none}.star-a{left:400px;top:151px;width:28px}.star-b{right:410px;top:343px;width:20px}.star-c{left:375px;top:716px;width:17px}.star-d{right:390px;top:772px;width:24px}
.brand{position:absolute;left:50%;top:162px;width:680px;height:156px;transform:translateX(-50%);object-fit:contain;z-index:4}
.greeting{position:absolute;top:338px;left:300px;right:300px;z-index:4;text-align:center}.greeting p{margin:0 0 8px;font-size:20px;font-weight:650;letter-spacing:7px;color:var(--muted)}.greeting h1{margin:0;color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-size:100px;font-weight:800;line-height:1.08;letter-spacing:8px}.greeting .festival{display:block;margin-top:14px;font-size:25px;font-weight:650;letter-spacing:6px;color:var(--ink)}
/* 원본 입력창은 제거하고 밑줄은 독립적인 장식선으로 유지합니다. */
.topic-underline{position:absolute;top:535px;left:395px;right:395px;height:22px;display:flex;align-items:center;gap:20px;z-index:4}.topic-underline::before,.topic-underline::after{content:'';height:3px;flex:1;background:linear-gradient(90deg,#c9a15b35,#c9a15b)}.topic-underline::after{transform:scaleX(-1)}.topic-underline svg{width:21px;height:21px;color:var(--gold);flex:none}
.clock-container{position:absolute;top:585px;left:320px;right:320px;z-index:4;text-align:center}.current-time-label{display:flex;gap:12px;align-items:center;justify-content:center;font-size:25px;font-weight:650;color:var(--muted);letter-spacing:3px}.live-dot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 5px #a92e3c0b}.time-display{margin-top:13px;font-size:176px;font-weight:750;line-height:1.14;font-variant-numeric:tabular-nums;font-feature-settings:'tnum';letter-spacing:2px;color:var(--ink);white-space:nowrap}.time-colon{color:var(--red);display:inline-block;padding:0 5px;font-weight:450;transform:translateY(-8px)}.date-display{display:inline-flex;align-items:center;gap:20px;margin-top:12px;padding:13px 37px;border-radius:50px;background:#f2f5f1;font-size:31px;font-weight:550;letter-spacing:1px;color:#36594b}.date-display .sep{height:22px;width:1px;background:#b8c8bc}.zone{position:absolute;top:927px;width:100%;text-align:center;font-size:14px;letter-spacing:3px;color:#61746a;z-index:4}.footer{position:absolute;left:0;right:0;bottom:45px;text-align:center;z-index:5;font-size:17px;letter-spacing:4px;color:#ecdec0}.footer b{font-weight:400;color:#cfb479;margin:0 20px}
.controls{position:fixed;bottom:16px;right:18px;z-index:20;display:flex;gap:7px;opacity:0;transition:opacity .25s;pointer-events:none}.controls.visible,.controls:hover,.controls:focus-within{opacity:1;pointer-events:auto}.controls button{border:1px solid #ffffff35;background:#092b23eb;color:#fff5df;padding:10px 14px;border-radius:9px;cursor:pointer;box-shadow:0 4px 12px #0002;font-size:13px}.controls button:hover{background:#1b4f40}.controls button[aria-pressed='false']{color:#becac2}.hint{position:fixed;left:18px;bottom:20px;color:#ffedcba6;font-size:12px;z-index:20;opacity:0;transition:opacity .25s}.hint.visible{opacity:1}.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);padding:12px 20px;color:white;background:#102e27f2;border:1px solid #c9a15b66;border-radius:10px;z-index:30;font-size:14px;max-width:90vw;text-align:center}.toast[hidden]{display:none}
@media(prefers-reduced-motion:reduce){.bulb{animation:none}.controls,.hint{transition:none}}@media print{.controls,.hint,.toast{display:none}body{background:white}}

/* 잔잔한 크리스마스 트윙클: 화면 섬광 없이 작은 금빛 점만 느리게 밝아집니다. */
.christmas-sparkles{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden;contain:layout paint}
.christmas-sparkle{position:absolute;display:block;color:#d6b36d;opacity:.35;transform-origin:center;animation:gentle-twinkle var(--duration) ease-in-out var(--delay) infinite;will-change:opacity,transform}
.christmas-sparkle svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 3px #dfba6680)}
.christmas-sparkle.pin{border-radius:50%;background:#ffe7a8;box-shadow:0 0 5px 1px #edcc8655}
.christmas-sparkle.on-frame{color:#f8dca0}
@keyframes gentle-twinkle{0%,100%{opacity:.22;transform:scale(.82)}50%{opacity:.82;transform:scale(1.12)}}
.small-star{animation:gentle-twinkle 7.8s ease-in-out infinite}
.star-b{animation-delay:-2.7s}.star-c{animation-delay:-5.1s}.star-d{animation-delay:-1.4s}
.bulb{animation-duration:6.8s}.bulb:nth-of-type(3n){animation-duration:8.1s;animation-delay:-4.3s}.bulb:nth-of-type(3n+1){animation-duration:5.9s;animation-delay:-1.2s}
@media(prefers-reduced-motion:reduce){.christmas-sparkle,.small-star,.bulb{animation:none;opacity:.5}.christmas-sparkle{will-change:auto}}

</style>

<script>
'use strict';
// 외부 이미지·폰트·스크립트 없이 단일 HTML로 실행됩니다.
const $ = id => document.getElementById(id);
const stage = $('stage');
function fitScreen(){ stage.style.setProperty('--scale',Math.min(window.innerWidth/1920,window.innerHeight/1080)); }
window.addEventListener('resize',fitScreen,{passive:true});
if(window.visualViewport)window.visualViewport.addEventListener('resize',fitScreen,{passive:true});
fitScreen();

// 한국 표준시. 기기의 현재 시간을 사용하므로 송출 PC의 자동 시간 설정을 켜 주세요.
const formatter = new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
let clockTimer;
function updateClock(){
 clearTimeout(clockTimer);
 const now=new Date(); const p={}; formatter.formatToParts(now).forEach(part=>p[part.type]=part.value);
 $('hh').textContent=p.hour; $('mm').textContent=p.minute; $('ss').textContent=p.second;
 $('current-time').setAttribute('aria-label',`${p.hour}시 ${p.minute}분 ${p.second}초`);
 $('current-date').textContent=`${p.year}.${p.month}.${p.day}`;
 $('current-day').textContent=`${p.weekday}요일`;
 clockTimer=setTimeout(updateClock,1000-now.getMilliseconds()+15);
}
updateClock();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateClock();});

const canvas=$('snow');const ctx=canvas.getContext('2d');canvas.width=1920;canvas.height=1080;
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
let snowOn=!reduced.matches,animationId=0,lastFrame=0;
const flakes=Array.from({length:85},()=>({x:Math.random()*1920,y:Math.random()*1080,r:.8+Math.random()*2.1,v:12+Math.random()*24,drift:Math.random()*Math.PI*2,alpha:.25+Math.random()*.4}));
function drawSnow(t){
 if(!snowOn||document.hidden){animationId=0;return;}
 const dt=lastFrame?Math.min((t-lastFrame)/1000,.05):0;lastFrame=t;ctx.clearRect(0,0,1920,1080);
 flakes.forEach(f=>{f.y+=f.v*dt;f.x+=Math.sin(t/2600+f.drift)*7*dt;if(f.y>1084){f.y=-4;f.x=Math.random()*1920;}if(f.x>1924)f.x=-4;if(f.x< -4)f.x=1924;ctx.beginPath();ctx.fillStyle=`rgba(255,246,224,${f.alpha})`;ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();});
 animationId=requestAnimationFrame(drawSnow);
}
function applySnow(){
 $('snow-toggle').setAttribute('aria-pressed',String(snowOn));$('snow-toggle').textContent=snowOn?'눈 효과 켜짐':'눈 효과 꺼짐';
 cancelAnimationFrame(animationId);animationId=0;lastFrame=0;
 if(snowOn&&!document.hidden)animationId=requestAnimationFrame(drawSnow);else ctx.clearRect(0,0,1920,1080);
}
$('snow-toggle').addEventListener('click',()=>{snowOn=!snowOn;applySnow();showControls();});
document.addEventListener('visibilitychange',()=>{cancelAnimationFrame(animationId);animationId=0;lastFrame=0;if(!document.hidden&&snowOn)animationId=requestAnimationFrame(drawSnow);});
applySnow();
let toastTimer;
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4500);}
async function toggleFullscreen(){
 try{if(!document.fullscreenElement){if(!document.documentElement.requestFullscreen){toast('이 브라우저에서는 F11 또는 브라우저의 전체화면 메뉴를 이용해 주세요.');return;}await document.documentElement.requestFullscreen();}else await document.exitFullscreen();}
 catch(e){toast('전체화면 전환이 제한되었습니다. 파일을 브라우저에서 직접 열고 F11을 눌러 주세요.');}
}
$('fullscreen-toggle').addEventListener('click',toggleFullscreen);
document.addEventListener('fullscreenchange',()=>{$('fullscreen-toggle').textContent=document.fullscreenElement?'전체화면 해제 ↙':'전체화면 ↗';fitScreen();});
let controlsTimer;
function showControls(){ $('controls').classList.add('visible');$('hint').classList.add('visible');clearTimeout(controlsTimer);controlsTimer=setTimeout(()=>{if($('controls').matches(':hover')||$('controls').contains(document.activeElement)){showControls();return;}$('controls').classList.remove('visible');$('hint').classList.remove('visible');},3000); }
window.addEventListener('pointermove',showControls,{passive:true});window.addEventListener('pointerdown',showControls,{passive:true});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||e.repeat)return;if(e.key==='Tab')showControls();if(e.key.toLowerCase()==='f'){e.preventDefault();toggleFullscreen();showControls();}if(e.key.toLowerCase()==='s'){e.preventDefault();snowOn=!snowOn;applySnow();showControls();}});
showControls();
</script>
